    <linearGradient id="baseLeft" x1="0.7" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#34503f"/>
      <stop offset="1" stop-color="#121c15"/>
    </linearGradient>
    <linearGradient id="baseRight" x1="0.2" y1="0" x2="0.8" y2="1">
