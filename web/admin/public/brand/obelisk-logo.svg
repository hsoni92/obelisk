<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 270" width="248" height="270">
  <defs>
    <linearGradient id="leftDark" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#6f9480"/>
      <stop offset="0.5" stop-color="#456352"/>
      <stop offset="1" stop-color="#18261d"/>
    </linearGradient>
    <linearGradient id="leftBevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4cdbb"/>
      <stop offset="0.55" stop-color="#7fa08c"/>
      <stop offset="1" stop-color="#3b5546"/>
    </linearGradient>
    <linearGradient id="centerLeft" x1="0.5" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#8fb09b"/>
      <stop offset="0.38" stop-color="#4d6b5a"/>
      <stop offset="0.78" stop-color="#2b4335"/>
      <stop offset="1" stop-color="#142019"/>
    </linearGradient>
    <linearGradient id="centerRight" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#eafa78"/>
      <stop offset="0.4" stop-color="#d7f249"/>
      <stop offset="1" stop-color="#9fbf26"/>
    </linearGradient>
    <linearGradient id="centerHighlight" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f8fdb0"/>
