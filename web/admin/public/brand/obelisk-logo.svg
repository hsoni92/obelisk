  <!-- Left tower -->
  <path d="M31 128 L67 106 L67 227 L31 207 Z" fill="url(#leftDark)"/>
  <path d="M67 106 L78 113 L68 227 L67 227 Z" fill="url(#leftBevel)"/>

  <!-- Central obelisk -->
