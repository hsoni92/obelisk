namespace: obelisk
obelisk:
  imageController: obelisk-controller:0.1.0
  imageAdminUI: obelisk-admin-ui:0.1.0
  configHostPath: /etc/obelisk/obelisk.yaml
  helmRoot: /opt/obelisk
  helmRootHostPath: /opt/obelisk
  # VPS: set to public IP or DNS (bootstrap auto-detects when empty on profile=vps).
  publicHost: ""
  # GitHub OAuth app for blueprint login. Create Secret obelisk-github-oauth
  # with client_id, client_secret, and optional redirect_uri. The controller
  # writes OAuth tokens to Secret obelisk-blueprint-github at runtime.
kong:
  enabled: true
  image: kong:3.6
  service:
    # LoadBalancer works on single-node k3s (servicelb) — use in VM/VPS smoke tests.
    type: ClusterIP