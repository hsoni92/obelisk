apiVersion: apps/v1
kind: Deployment
metadata:
  name: obelisk-controller
  labels:
    app.kubernetes.io/name: obelisk-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: obelisk-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: obelisk-controller
    spec:
      serviceAccountName: obelisk-controller
      containers:
        - name: controller
          image: {{ .Values.obelisk.imageController }}
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            capabilities:
              add: ["SYS_ADMIN"]
          args:
            - -config={{ .Values.obelisk.configHostPath }}
            - -helm-root={{ .Values.obelisk.helmRoot }}
            - -listen=:8080
            - -gateway-listen=:8081
            - -mail-gateway-listen=:8082
          env:
            - name: OBELISK_RECONCILE
              value: cluster
            - name: OBELISK_NAMESPACE
              value: {{ .Release.Namespace }}
            - name: OBELISK_HTTP_PORT
              value: {{ .Values.obelisk.adminHTTPPort | default 9080 | quote }}
            - name: OBELISK_TLS_PORT
              value: {{ .Values.nativeEdge.service.tlsPort | default 9443 | quote }}
            {{- if .Values.obelisk.publicHost }}
            - name: OBELISK_PUBLIC_HOST
              value: {{ .Values.obelisk.publicHost | quote }}
            {{- end }}
            - name: OBELISK_CREDENTIALS_DIR
              value: /var/lib/obelisk/credentials
            - name: OBELISK_TAILSCALE_SOCKET
              value: /var/run/tailscale/tailscaled.sock
            - name: OBELISK_GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: obelisk-github-oauth
                  key: client_id
                  optional: true
            - name: OBELISK_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: obelisk-github-oauth
                  key: client_secret
                  optional: true
            - name: OBELISK_GITHUB_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: obelisk-github-oauth
                  key: redirect_uri
                  optional: true
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: openrouter
            - containerPort: 8082
              name: mail
          volumeMounts:
            - name: obelisk-config
              mountPath: /etc/obelisk
              readOnly: true
            - name: obelisk-lib
              mountPath: /var/lib/obelisk
            - name: obelisk-helm-root
              mountPath: /opt/obelisk
              readOnly: true
            - name: tailscale-socket
              mountPath: /var/run/tailscale
      volumes:
        - name: obelisk-config
          hostPath:
            path: /etc/obelisk
            type: DirectoryOrCreate
        - name: obelisk-lib
          hostPath:
            path: /var/lib/obelisk
            type: DirectoryOrCreate
        - name: obelisk-helm-root
          hostPath:
            path: {{ .Values.obelisk.helmRootHostPath | default "/opt/obelisk" }}
            type: Directory
        - name: tailscale-socket
          hostPath:
            path: /var/run/tailscale
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: obelisk-controller
spec:
  selector:
    app.kubernetes.io/name: obelisk-controller
  ports:
    - port: 8080
      targetPort: http
      name: http
    - port: 8081
      targetPort: openrouter
      name: openrouter
    - port: 8082
      targetPort: mail
      name: mail
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: obelisk-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: obelisk-controller
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets/scale", "deployments/scale", "replicasets/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets", "persistentvolumeclaims", "events", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: obelisk-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: obelisk-controller
subjects:
  - kind: ServiceAccount
    name: obelisk-controller
    namespace: {{ .Release.Namespace }}