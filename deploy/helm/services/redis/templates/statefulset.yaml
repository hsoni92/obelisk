apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.image }}
          args:
            - redis-server
            - --maxmemory
            - "256mb"
            - --maxmemory-policy
            - allkeys-lru
            {{- if .Values.edgeTLS.enabled }}
            - --tls-port
            - "6379"
            - --port
            - "0"
            - --tls-cert-file
            - /var/run/edge/tls.crt
            - --tls-key-file
            - /var/run/edge/tls.key
            - --tls-auth-clients
            - "no"
            {{- end }}
            {{- if .Values.credentials.password }}
            - --requirepass
            - $(REDIS_PASSWORD)
            {{- end }}
          env:
            {{- if .Values.credentials.password }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}
                  key: password
            {{- end }}
          ports:
            - containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.edgeTLS.enabled }}
            - name: edge-tls
              mountPath: /var/run/edge
              readOnly: true
            {{- end }}
      {{- if .Values.edgeTLS.enabled }}
      volumes:
        - name: edge-tls
          secret:
            secretName: {{ .Values.edgeTLS.secretName }}
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector:
    app: {{ .Release.Name }}
  ports:
    - port: 6379
      targetPort: 6379