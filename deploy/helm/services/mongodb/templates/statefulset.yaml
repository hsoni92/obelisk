apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      {{- if .Values.edgeTLS.enabled }}
      initContainers:
        - name: edge-tls-init
          image: {{ .Values.image }}
          command:
            - /bin/sh
            - -ec
            - |
              cp /edge-src/tls.pem /edge-dst/tls.pem
              chown mongodb:mongodb /edge-dst/tls.pem
              chmod 0600 /edge-dst/tls.pem
          volumeMounts:
            - name: edge-tls-src
              mountPath: /edge-src
              readOnly: true
            - name: edge-tls
              mountPath: /edge-dst
      {{- end }}
      containers:
        - name: mongodb
          image: {{ .Values.image }}
          {{- if .Values.edgeTLS.enabled }}
          args:
            # MongoDB 7+ (SERVER-72839) requires a trust chain when TLS is enabled.
            - --tlsMode=requireTLS
            - --tlsCertificateKeyFile=/var/run/edge/tls.pem
            - --tlsCAFile=/var/run/edge/tls.pem
            - --tlsAllowConnectionsWithoutCertificates
          {{- end }}
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}
                  key: username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}
                  key: password
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}
                  key: database
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data/db
            {{- if .Values.edgeTLS.enabled }}
            - name: edge-tls
              mountPath: /var/run/edge
              readOnly: true
            {{- end }}
      {{- if .Values.edgeTLS.enabled }}
      volumes:
        - name: edge-tls-src
          secret:
            secretName: {{ .Values.edgeTLS.secretName }}
            items:
              - key: tls.pem
                path: tls.pem
        - name: edge-tls
          emptyDir: {}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector:
    app: {{ .Release.Name }}
  ports:
    - port: 27017
      targetPort: 27017