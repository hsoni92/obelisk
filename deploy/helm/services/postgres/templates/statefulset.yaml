apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.image }}
          {{- if .Values.edgeTLS.enabled }}
          command: ["docker-entrypoint.sh", "postgres"]
          args:
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/var/run/edge/tls.crt
            - -c
            - ssl_key_file=/var/run/edge/tls.key
          {{- end }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}
                  key: database
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.credentials.username | default "obelisk" | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            {{- if .Values.edgeTLS.enabled }}
            - name: edge-tls
              mountPath: /var/run/edge
              readOnly: true
            {{- end }}
      {{- if .Values.edgeTLS.enabled }}
      volumes:
        - name: edge-tls
          secret:
            secretName: {{ .Values.edgeTLS.secretName }}
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector:
    app: {{ .Release.Name }}
  ports:
    - port: 5432
      targetPort: 5432