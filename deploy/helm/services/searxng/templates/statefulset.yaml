apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      securityContext:
        fsGroup: 977
      initContainers:
        - name: seed-config
          image: alpine:3.20
          command:
            - sh
            - -ec
            - |
              set -e
              cfg=/etc/searxng/settings.yml
              seed=/seed/settings.yml
              if [ ! -f "$cfg" ]; then
                cp "$seed" "$cfg"
              elif ! grep -qE '(^|[[:space:]]*-[[:space:]]*)json[[:space:]]*$' "$cfg"; then
                printf '\n# obelisk: enable JSON search API for connected clients\nsearch:\n  formats:\n    - html\n    - json\n' >> "$cfg"
              fi
              chown 977:977 "$cfg"
              chmod 644 "$cfg"
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: config
              mountPath: /etc/searxng
            - name: config-seed
              mountPath: /seed
              readOnly: true
      containers:
        - name: searxng
          image: {{ .Values.image }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SEARXNG_BASE_URL
              value: {{ .Values.baseUrl | quote }}
            - name: FORCE_OWNERSHIP
              value: "true"
            {{- if .Values.credentials.secretKey }}
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}
                  key: secretKey
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/searxng
            - name: data
              mountPath: /var/cache/searxng
      volumes:
        - name: config-seed
          configMap:
            name: {{ .Release.Name }}-config
  volumeClaimTemplates:
    - metadata:
        name: config
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 128Mi
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
