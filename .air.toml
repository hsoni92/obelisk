# Hot-reload for obelisk-controller (used by scripts/dev.sh / make dev).
root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/obelisk-controller"
  cmd = "go build -o ./tmp/obelisk-controller ./cmd/obelisk-controller"
  delay = 800
  exclude_dir = ["tmp", "bin", "web", "deploy", "docs", "install", "node_modules", ".git"]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go"]
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = false
  full_bin = "./scripts/run-controller-dev.sh"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false