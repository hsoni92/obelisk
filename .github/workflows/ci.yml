name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.22"
  NODE_VERSION: "20"
  HELM_VERSION: "v3.14.4"
  GITLEAKS_VERSION: "v8.21.2"

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Tests
        run: go test ./cmd/... ./internal/... ./pkg/...
      - name: Build binaries
        run: |
          go build -o /dev/null ./cmd/obelisk
          go build -o /dev/null ./cmd/obelisk-controller
      - name: go vet
        run: go vet ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - run: npm ci
      - name: ESLint (advisory until brownfield cleanup)
        continue-on-error: true
        run: npm run lint
      - run: npm run build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - run: make helm-lint

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          ver="${GITLEAKS_VERSION#v}"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${ver}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Scan repository
        run: gitleaks detect --config .gitleaks.toml --verbose